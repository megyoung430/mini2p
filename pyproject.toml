[project]
name = "mini2p-preprocessing"
version = "0.1.0"
description = "Mini2P scan-phase correction, destriping, distortion correction and Suite2p registration"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "tifffile>=2024.1.30",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "suite2p>=1.0",
    "torch>=2.0",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=10.1",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.1", "jupyterlab>=4.1"]

[project.scripts]
mini2p-preprocess = "mini2p_preprocessing.cli:main"
mini2p-extract = "mini2p_preprocessing.cli:extract_main"
mini2p-movie = "mini2p_preprocessing.cli:movie_main"
mini2p-natex = "mini2p_preprocessing.cli:natex_main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini2p_preprocessing"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
