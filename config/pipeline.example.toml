# Copy to config/pipeline.toml (git-ignored) and fill in the paths for your machine.
# Values below are the settings the original notebook used.
# Top-level keys must come before the first [table] header.

overwrite = true
# max_timepoints = 300        # uncomment for a quick test run
output_dtype = "int16"        # TIFFs for Suite2p, rounded and clipped here; "float32" leaves
                              # the conversion to Suite2p (which truncates and wraps)
max_clipped_fraction = 1e-4   # more clipped than this stops the run

[channels]
n_channels = 2          # pages must be ch1 red, ch2 green, interleaved
structural_channel = 1  # red, 1-based
functional_channel = 2  # green, calcium/ROI channel

[phase]
method = "per_frame"         # "per_frame" (each frame its own phase) or "chunked" (one per chunk)
max_shift_px = 40            # raise only if the phase reaches this boundary
# ---- per_frame: structural sets a frame's phase where it is consistent and agrees with
# the functional channel; elsewhere the functional channel over fallback_window_frames.
consistency_window_frames = 9    # odd; frames whose per-frame phases are compared
consistency_tolerance_px = 2     # "agree" = within this many px of their running median
consistency_threshold = 0.7      # fraction that must agree (tissue ~0.9, noise ~0.4)
agreement_px = 6                 # structural is backed if this close to the functional phase,
support_window_frames = 15       # odd; or if functional over these frames prefers it:
support_t_threshold = 1.5        #   local vote (t-like) needed to back the structural phase
contradict_t_threshold = 2.0     #   vote against that overrules agreement_px
contradict_min_px = 2            #   ...only when the phases differ by more than this
trust_window_frames = 25         # odd; a frame follows the majority of these
fallback_window_frames = 101     # odd; functional frames averaged where structural fails
frames_per_read = 50             # memory only (~300 MB per channel for 512 x 512 frames)
boundary_warning_px = 2          # flag phases this close to ±max_shift_px
# ---- chunked only: uncomment with method = "chunked" (per_frame warns that it ignores them)
# chunk_frames = 100           # 10-25 helps when the phase changes quickly
# estimator = "wide"           # "wide" or "suite2p" (Suite2p searches only ±10 px)
# score_crop_px = 40           # omit to crop max_shift_px from both edges
# alignment_source = "functional"   # "best_score", "structural" or "functional"
# score_switch_margin = 0.0
# run_second_pass = true
# second_pass_mode = "chunked"      # "chunked" or "whole"
# second_pass_global_max_frames = 2000

[phase.manual_first_phase_by_start]   # chunked only: chunk start timepoint = phase in px
# 200 = -17

[phase.manual_second_phase_by_start]  # chunked only

[destripe]
enabled = false
preserve_frame_mean = true

[distortion]
mode = "local_batched"        # "local_batched", "cluster_full" or "off"
transform_mat = "/path/to/transform_matrix312_A049.mat"
calibration_script_dir = "/path/to/folder/with/distortion_correct_full_recording.py"
z_um = 0
interpolation_order = 1
crop_black_borders = true
crop_padding_px = 1
batch_frames = 500

[registration]
fs_hz = 7.52                  # frames/s per channel
diameter_px = 12
nonrigid = true
norm_frames = false
nimg_init = 1000
th_badframes = 0.7
two_step_registration = true
batch_size = 500
keep_raw_binary = false
save_folder = "suite2p"
# fast_disk = "/Users/you/suite2p_fast"  # local folder for Suite2p's working binaries
#   (~7 GB per run); much faster and more robust than writing them to a network share
run_roi_detection = false
motion_alignment_source = "auto"   # "structural", "functional", or "auto": structural where
                                   # the per-frame bidiphase step trusted it for at least
auto_structural_min_fraction = 0.5 # this fraction of frames, else functional. Suite2p's
                                   # output goes in <variant>/aligned_<channel>/suite2p/

[fluorescence]
neuropil_coefficient = 0.7
baseline = "maximin"          # "maximin" or "prctile"
win_baseline_s = 60.0
sig_baseline_frames = 10.0
prctile_baseline = 8.0
min_f0 = 0.0                  # ΔF/F0 is NaN where F0 <= this
tau_s = 1.0                   # indicator decay for OASIS deconvolution
batch_size = 500
torch_device = "cpu"          # "cuda" on a GPU machine
gr_median_window_s = 0.25
gr_red_floor_percentile = 5.0
gr_red_floor_min = 0.001
mask_max_shift_px = 50          # largest offset allowed when aligning masks
mask_shift_tolerance_px = 1     # allowed disagreement between image quadrants
mask_min_correlation = 0.5      # rank correlation required after the shift
mask_min_retained_fraction = 0.5  # masks keeping less of their pixels are dropped
background_chunk_frames = 100   # frames read at once for the vessel background (QC notebook)

# ---- used by the QC notebook ----
# Keep run_dir outside derivatives_subject_dir: the batch planner treats a run
# folder holding a .phase.json but no manifest as finished and skips it.
[qc]
input_tiff = "/path/to/rawdata/.../funcimg/71rtask_00040.tif"
run_dir = "/path/to/scratch/mini2p-qc/MY_71_R/run-02"
qc_start_timepoint = 0
qc_registration_frames = 500
qc_distortion_frames = 100
# cellpose_seg = "/path/to/run-02/with_distortion_correction/without_destriping/aligned_structural/suite2p/plane0/meanImg_green_functional_contrast_seg.npy"
# Only if the masks were drawn on another registration's mean image (e.g. first 1000 frames):
# cellpose_image = "/path/to/that/meanImg_green_functional_contrast.png"
# Blood vessels segmented in Cellpose: their fluorescence is the background regressed out
# of F and Fneu before ΔF/F0 (QC notebook). Drawn on this registration's mean image, or set
# background_image to the image they were drawn on to shift them onto this plane.
# background_seg = "/path/to/meanImg_green_blood_vessel_seg.npy"
# background_image = "/path/to/that/meanImg_green_raw.tif"
# valid_frames = "/path/to/session/valid_frames.npz"
valid_frames_key = "valid_frames"

# ---- used by the batch notebook ----
[batch]
raw_subject_dir = "/path/to/rawdata/cohort-01/sub-03_id-MY_71_R"
derivatives_subject_dir = "/path/to/derivatives/cohort-01/sub-03_id-MY_71_R"
session_first = 216
session_last = 231
source_substring = "71rtask"
destripe = false              # false -> run-XX/<distortion>/without_destriping/, true -> .../with_destriping/
                              # <distortion>: with_distortion_correction, or without_... when [distortion] mode = "off"
stop_on_error = true
retry_incomplete_runs = true
# Register again, replacing them, the runs that finished before this time; keep the
# same time when relaunching after a failure. Needs overwrite = true.
# rerun_completed_before = 2026-10-21T09:00:00+01:00
# Cellpose masks for each run-XX and the image they were drawn on, relative to run-XX/
cellpose_seg = "suite2p/plane0/meanImg_green_functional_contrast_seg.npy"
cellpose_image = "suite2p/plane0/meanImg_green_functional_contrast.png"

[exports]
subject_dir = "/path/to/derivatives/cohort-01/sub-03_id-MY_71_R"
session_first = 216
session_last = 231
expected_runs = 68
run_subdir = "with_distortion_correction/without_destriping"  # or .../with_destriping, or "without_distortion_correction/..."
alignment = "auto"            # the one aligned_* folder each run has; or "structural" / "functional"
black_percentile = 5.0
white_percentile = 99.5
gamma = 1.2
high_resolution_dpi = 400
overwrite = false             # per-run exports
pdf_overwrite = false

[movies]                      # mini2p-movie; see README "Movies"
# Which run: by name (cohort, subject, session, run under derivatives_root), or by path
# run_dir = "/Users/you/Desktop/example_ses/img"   # set: the by-name settings are ignored
cohort = "cohort-01"
subject = "sub-03"            # the subject folder or part of it ("MY_71_R" works too)
session = 224
run = 1                       # run-01
variant = "with_distortion_correction/without_destriping"   # or .../with_destriping, or "without_distortion_correction/..."
alignment = "auto"            # the one aligned_* folder; or "structural" / "functional"
# Which frames: the whole recording, or start_frame to end_frame (0-based, both included)
whole_recording = false       # true ignores start_frame and end_frame
start_frame = 10
end_frame = 150
# Which stages of the preprocessing
stage_raw = true              # the acquired TIFF
stage_bidiphase = true        # + phase correction (and destriping)
stage_undistorted = true      # + distortion correction
stage_registered = true       # + motion registration (Suite2p's binaries)
stage_background_removed = false  # + background regressed out of every pixel
                              #   (data_background_removed_<source>.tif, from the QC notebook)
background_source = "vessel"  # that background: "vessel" or "non_roi" (outside the ROIs)
# Which versions of each
unaveraged_movie = true       # every frame
averaged_movie = true         # average_frames frames per movie frame
behavior = false              # true: also each movie with the behavior video on the left,
                              #   in sync (needs run-XX/frame_times.npz and video_frame_times.npz
                              #   from magnitude-bandit-analysis's reward_responses notebook)
# Where to read and write
derivatives_root = "/path/to/derivatives"   # cohort-XX/<subject>/ses-*/funcimg/run-XX (by name)
# raw_tiff = "/path/to/71rtask_00039.tif"   # only if not where source_tiff.json says
# behavior_video = "/path/to/MY_71_R_2026-08-07-105203.mp4"   # only if not where video_frame_times.npz says
# output_dir = "/Users/you/movies"          # default: run-XX/<variant>/movies
overwrite = false
# How they look (greyscale)
channel = "side_by_side"      # functional left, structural right; or "green", "red" alone
average_frames = 5            # 2-256
average_mode = "bin"          # "bin" or "rolling"
speed = 4.0                   # x real time; a movie must play at >= 1 fps
black_percentile = 1.0        # contrast as in the QC notebook, per channel
white_percentile = 99.8
gamma = 1.0
spatial_sigma_px = 0.0        # Gaussian smoothing of the averaged movie; unaveraged never is
upscale = 1                   # pixels drawn upscale x upscale
label = true                  # stage, time, frames, speed and channel burnt into each frame
suite2p_crop = false          # true: also a copy of each registered movie cropped to the
                              # region no frame's registration shifts wrap into

[natex]                       # mini2p-natex; NATEX's defaults (see README "NATEX")
moving_window_s = 30.0        # running window for F0 and the local SD
lowpass_hz = 2.0              # low-pass, for finding transients only
transient_s = 0.75            # a significant transient lasts at least this
extend_s = 0.4                # margin added on both sides of a transient
# neuropil_coefficient = 0.7  # default: [fluorescence] neuropil_coefficient
only_iscell = false           # true: Suite2p "cells" only, as NATEX does
