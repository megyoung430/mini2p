[[section]]
name = "tests/"
text = "About 40 pytest files (around 660 test functions), one or more per module, all on small synthetic data built in the tests (<code>conftest.py</code>: interleaved TIFFs with a known phase error, textured images, soma fields, a fake distortion calibration). <code>tests/reference/</code> holds verbatim copies of the code this package replaced (the original notebook's functions, the distortion script, <code>plane_snr.py</code>), and tests check the package reproduces them."

[[section]]
name = "config/"
text = "<code>pipeline.example.toml</code>, the template for your <code>pipeline.toml</code>: the pipeline sections <code>[channels]</code>, <code>[phase]</code>, <code>[destripe]</code>, <code>[distortion]</code>, <code>[registration]</code>, <code>[fluorescence]</code>, <code>[focus]</code>, and sections read by their own loaders: <code>[qc]</code>, <code>[batch]</code>, <code>[exports]</code>, <code>[movies]</code>, <code>[natex]</code>. Real configs are git-ignored."

[[section]]
name = "docs/"
text = "<code>settings.md</code>, the settings reference; <code>code_map/</code>, the hand-written text of this page (<code>overviews.toml</code>, the schematics, <code>descriptions.tsv</code> for definitions without a docstring, <code>explanations.md</code> for the In plain words sections)."

[[section]]
name = "README.md"
text = "Setup, running (variants, local Suite2p binaries, several registrations of one variant, comparing a sweep, reruns), movies, NATEX, QC notebook outputs, the steps from registration to ΔF/F0, frame order, output data type, scan-phase correction, how the package relates to the original notebook and scripts, and known issues."

[[section]]
name = "pyproject.toml / uv.lock"
text = "Package <code>mini2p-preprocessing</code>, Python ≥ 3.11: numpy, scipy, tifffile, matplotlib, pydantic, suite2p ≥ 1.0, torch, imageio-ffmpeg, pillow, scikit-image; a <code>notebook</code> extra (ipywidgets, jupyterlab); a dev group (pytest, ruff). Declares the six commands. Install with <code>uv sync --extra notebook</code> wherever you use the notebooks: a plain <code>uv sync</code> removes the extra's packages, JupyterLab included."

