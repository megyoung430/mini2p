# Hand-written text for the code map (scripts/build_code_map.py). HTML is allowed in values.
# [[topic]]s are the overview sections at the top of the page, in this order; "svg" names a
# schematic in schematics/. [[group]]s list the package's files under named sections, in this
# order, before the folders; [package] summarizes folders, in this order; [module] overrides a file's docstring summary.

intro = "mini2p (package <code>mini2p_preprocessing</code>) turns a raw two-channel Mini2P ScanImage TIFF into registered movies, Cellpose-mask traces and ΔF/F0, with QC at every step. It corrects the odd/even scan-line phase (and optionally stripes), corrects the lens distortion with the scope's fixed calibration, registers with Suite2p, moves hand-drawn Cellpose masks onto each registration, extracts traces for both channels and computes ΔF/F0, with several background and red-channel corrections to compare. Commands run one recording or a whole batch of sessions; notebooks drive the QC of one run and the post-batch steps. The layout follows the Good Research Code Handbook: an importable package in <code>src/</code>, notebooks and commands that call it, tests in <code>tests/</code>."

[[topic]]
title = "Processing one run"
svg = "schematics/processing_flow.svg"
caption = "Solid boxes run in the package; the dashed one is done by hand. Steps 1 to 3 are one <code>mini2p-preprocess</code> call (or one batch worker); steps 5 to 7 run from the notebooks or the other commands."
text = """
<p>A <b>run</b> is one raw TIFF, interleaving the red (structural) and green (functional, calcium) channels frame by frame. Each step reads the previous step's file and writes its own beside it, with a JSON sidecar saying what it did, so any step can be checked or rerun on its own.</p>
<ol>
<li><b>Scan phase</b> (<code>correction</code>, <code>frame_phase</code>, <code>bidiphase</code>): a resonant scanner writes odd and even lines in opposite directions, and their horizontal offset drifts. Each frame's offset is measured (red where it has texture, green summed over a longer window where it does not) and undone; <code>phase.method = "chunked"</code> uses one phase per chunk instead. Optional destriping (<code>destripe</code>) runs in the same pass.</li>
<li><b>Distortion</b> (<code>distortion</code>, <code>calibration</code>): every frame is warped with the scope's fixed calibration and cropped to the area every output pixel samples inside the raw frame.</li>
<li><b>Registration</b> (<code>registration</code>): Suite2p motion correction, with motion estimated on the red or green channel (<code>"auto"</code> chooses per run from how often the phase step trusted red). Each <code>[registration] save_folder</code> is a registration of its own.</li>
<li><b>Segmentation</b>: by hand in Cellpose, on a registered mean image exported by <code>exports</code> or the QC notebook.</li>
<li><b>Extraction</b> (<code>alignment</code>, <code>extraction</code>): the masks are shifted onto the plane when they were drawn on another registration's image, then F and Fneu are extracted for both channels, replacing Suite2p's trace files.</li>
<li><b>ΔF/F0</b> (<code>fluorescence</code>, <code>background</code>, <code>photon_free</code>, <code>natex</code>): neuropil correction, F0 and ΔF/F0, with the drifting photon-free level removed frame by frame (on by default), optional background or red-channel regression, and the NATEX port.</li>
<li><b>QC</b> (<code>qc</code>, <code>focus</code>, <code>frame_order</code>, <code>plots</code>, <code>exports</code>, <code>movies</code>, <code>registration_comparison</code>): figures saved under <code>quality_control/</code>, mean-image exports and review PDFs, stage movies, and side-by-side comparison of registration settings.</li>
</ol>
"""

[[topic]]
title = "Where outputs go"
svg = "schematics/folder_layout.svg"
caption = "The derivatives tree mirrors the raw one (NeuroBlueprint, with a cohort level). Names in bold are folders you choose between: the run, the variant, the alignment channel and the save_folder."
text = """
<p>A run's outputs live in a <b>variant</b> folder named for the corrections applied, <code>run-XX/&lt;with|without&gt;_distortion_correction/&lt;with|without&gt;_destriping/</code>, so the same TIFF can be processed several ways side by side (with <code>overwrite = false</code>, a stage whose output exists stops with an error rather than replace it). Inside it, <code>aligned_&lt;channel&gt;/&lt;save_folder&gt;/</code> is one registration: its <code>plane0/</code> (Suite2p's results and binaries, the extracted traces, the mean-image exports), its <code>motion_alignment.json</code>, and the QC plots and movies made from it. So a registration sweep (nonrigid or not, <code>smooth_sigma</code>, <code>norm_frames</code>) keeps each registration's files apart, and <code>mini2p-compare-registrations</code> measures them side by side. <code>run-XX/suite2p/</code>, outside any variant, is the registration the Cellpose masks were drawn on; the batch never changes it, and only checks that it came from the same TIFF as the run.</p>
"""

[[topic]]
title = "Commands"
text = """
<div class="tbl"><table>
<tr><th>Command</th><th>Function</th><th>What it does</th></tr>
<tr><td><code>mini2p-preprocess</code></td><td><code>cli.main</code></td><td>Steps 1 to 3 for one raw TIFF (<code>pipeline.run_pipeline</code>) into a variant folder.</td></tr>
<tr><td><code>mini2p-extract</code></td><td><code>cli.extract_main</code></td><td>Step 5 for one plane folder: align the Cellpose masks if needed and extract traces.</td></tr>
<tr><td><code>mini2p-movie</code></td><td><code>cli.movie_main</code></td><td>Movies of a run's stages, as set in <code>[movies]</code> (any setting can be overridden on the command line).</td></tr>
<tr><td><code>mini2p-natex</code></td><td><code>cli.natex_main</code></td><td>NATEX's ΔF/F, transients, SNR and cleaned events on one or more plane folders.</td></tr>
<tr><td><code>mini2p-raw-means</code></td><td><code>cli.raw_means_main</code></td><td>The mean of the first frames of every raw TIFF of a subject, before any processing, to see which recordings are worth processing.</td></tr>
<tr><td><code>mini2p-compare-registrations</code></td><td><code>cli.compare_registrations_main</code></td><td>Every registration of one <code>aligned_&lt;channel&gt;/</code> folder measured the same way: alignment, signal quality and putative-cell SNR and transients, without segmentation.</td></tr>
</table></div>
<p>Settings come from one TOML file (<code>config/pipeline.toml</code>, copied from <code>config/pipeline.example.toml</code>; never committed). <code>docs/settings.md</code> says which code reads each section, what to rerun after changing a setting, and every setting's default and effect.</p>
"""

[[topic]]
title = "Many runs: the batch"
text = """
<ol>
<li><b>Plan</b> (<code>batch.plan_batch</code>): every raw TIFF in a range of sessions whose name contains <code>[batch] source_substring</code> gets a run, <code>run-01</code>, <code>run-02</code>, … in acquisition order. Each run's variant folder holds a <code>source_tiff.json</code> saying which TIFF it came from and whether it finished, so runs already done are skipped and a TIFF that would land on another's run is a conflict, never an overwrite.</li>
<li><b>Run</b> (<code>batch.run_batch</code>): each pending TIFF goes through <code>mini2p-preprocess</code> in a fresh Python process; the launch's config is frozen as <code>batch_config_&lt;time&gt;.toml</code>.</li>
<li><b>Export and review</b> (<code>exports</code>): fixed-contrast mean images of every run, and review PDFs to check them by eye.</li>
<li><b>Segment</b> each run's mean image in Cellpose, by hand.</li>
<li><b>Extract</b> (<code>cellpose_batch</code>): the masks into every run, with a summary table and a PDF of each run's mask alignment.</li>
</ol>
<p><code>batch_and_exports.ipynb</code> drives all of it; <code>post_batch_sessions.ipynb</code> does steps 3 and 5 for the runs a live batch has already finished.</p>
"""

