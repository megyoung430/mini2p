[package]
"notebooks (top level)" = "Interactive work on top of the package: one run's QC, the batch with exports and extraction, the post-batch steps, and comparing ΔF/F0 corrections."
"src/code_map" = "The code-map builder: reads definitions and docstrings with <code>ast</code> (<code>extract</code>, <code>docstrings</code>), joins them with the hand-written text (<code>assemble</code>, <code>explanations</code>) and renders one self-contained HTML page (<code>render</code>, <code>template.html</code>). Reading files is kept in <code>files</code>."
"scripts (top level)" = "Command-line scripts that are not package commands."

[notebook]
"notebooks/qc_single_run.ipynb" = "One recording from <code>[qc]</code>, step by step: raw mean image, phase preview, the corrected TIFF, before/after images of each correction, distortion, Suite2p registration and its diagnostics, frames that still do not match, frame order, mean-image contrast, the fluorescence audit, and background and red-channel corrections. Every figure is saved under <code>quality_control/</code>."
"notebooks/batch_and_exports.ipynb" = "Plan and launch the batch for a range of sessions, export fixed-contrast mean images and review PDFs, then extract the Cellpose masks into every run and review their alignment."
"notebooks/post_batch_sessions.ipynb" = "Alongside a live batch: finds the runs it has finished and does only their exports, extraction and alignment review."
"notebooks/extraction_comparison.ipynb" = "For the <code>[qc]</code> run: how far ROIs stand above their surroundings, the field-wide green and red fluctuation, each neuropil and background correction's F0, noise and skew, and the same ROIs under each correction."
